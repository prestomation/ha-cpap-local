name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest pytest-homeassistant-custom-component
          # Pinned to commit hash for stability; update to PyPI release once pycpap>=0.2.0 is published
          pip install "git+https://github.com/prestomation/pycpap.git@a97502cd36c3e4dd818c7dce6044efa501aedc1d"

      - name: Run tests
        run: |
          pytest tests/ -v
